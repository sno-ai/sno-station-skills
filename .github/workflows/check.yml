name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install PyYAML and gitleaks
        run: |
          python3 -m pip install --quiet pyyaml
          version=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Install the sno program (the sno-cli self-test checks its help text)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the program from the public sno-cli release: no installer and no setup, so nothing is
          # counted as an install.
          asset=sno-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP"
          gh release download --repo sno-ai/sno-cli --pattern "$asset"
          want=$(gh release view --repo sno-ai/sno-cli --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [ "$want" = "sha256:$(sha256sum "$asset" | cut -d ' ' -f1)" ] || { echo "the sno download does not match its digest"; exit 1; }
          tar -xzf "$asset"
          sudo install -m 0755 sno-x86_64-unknown-linux-gnu/sno /usr/local/bin/sno
          sno --version
      - name: Check the change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git rev-parse HEAD~1); fi
          bash scripts/check.sh "$BASE"
